name: resume-zhiguang
services:
  mysql:
    image: mysql:8.0.39
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: local-dev-password
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: zhiguang
      TZ: Asia/Shanghai
    # Explicit flags also work on Windows, where bind-mounted .cnf permissions
    # can make MySQL ignore the file as world-writable.
    command: ["--default-authentication-plugin=mysql_native_password", "--server-id=1", "--log-bin=mysql-bin", "--binlog-format=ROW", "--binlog-row-image=FULL", "--binlog-expire-logs-seconds=604800", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./.docker/mysql/init/01-canal-user.sql:/docker-entrypoint-initdb.d/01-canal-user.sql:ro
      - ./db/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
      - ./db/test_users.sql:/docker-entrypoint-initdb.d/03-test_users.sql:ro
      - ./db/test_know_posts.sql:/docker-entrypoint-initdb.d/04-test_know_posts.sql:ro
      - ./deploy/demo-user.sql:/docker-entrypoint-initdb.d/05-demo-user.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 60
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "local-dev-password"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a local-dev-password ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 30
  kafka:
    image: apache/kafka:4.1.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes: ["kafka_data:/var/lib/kafka/data"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 40
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.1
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes: ["elasticsearch_data:/usr/share/elasticsearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 40
  canal:
    image: canal/canal-server:v1.1.7
    restart: unless-stopped
    depends_on:
      mysql: {condition: service_healthy}
    volumes:
      - ./.docker/canal/conf/example/instance.properties:/home/admin/canal-server/conf/example/instance.properties:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/127.0.0.1/11111'"]
      interval: 10s
      timeout: 5s
      retries: 40
  backend:
    build: .
    restart: unless-stopped
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}
      canal: {condition: service_healthy}
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_PASSWORD: local-dev-password
      SPRING_DATA_REDIS_PASSWORD: local-dev-password
      CANAL_PASSWORD: local-dev-password
      SPRING_AI_MODEL_CHAT: deepseek
      SEARCH_FETCH_CONTENT: ${SEARCH_FETCH_CONTENT:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-not-configured}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-not-configured}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_PUBLIC_DOMAIN: ${OSS_PUBLIC_DOMAIN:-}
      AUTH_JWT_PRIVATE_KEY: file:/app/keys/private.pem
      AUTH_JWT_PUBLIC_KEY: file:/app/keys/public.pem
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx768m
    volumes: ["jwt_keys:/app/keys"]
    ports: ["127.0.0.1:${ZHIGUANG_API_PORT:-18082}:8080"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 45
      start_period: 30s
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
    ports: ["127.0.0.1:${ZHIGUANG_WEB_PORT:-15173}:80"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  mysql_data:
  redis_data:
  kafka_data:
  elasticsearch_data:
  jwt_keys:
